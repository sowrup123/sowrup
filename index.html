<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Namuna 💗</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at top, #ffe0ec 0%, #ffb6c1 45%, #ffc8dd 100%);
      color: #5a1230;
      position: relative;
    }

    /* Soft moving background glow */
    .glow {
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.65), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.45), transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,0.35), transparent 45%);
      animation: drift 10s ease-in-out infinite alternate;
      filter: blur(20px);
      opacity: 0.9;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes drift {
      from { transform: translate(-2%, -2%) scale(1.02); }
      to { transform: translate(2%, 2%) scale(1.06); }
    }

    /* Main Container */
    .stage {
      position: relative;
      z-index: 2;
      width: min(92vw, 540px);
      padding: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: 0 20px 45px rgba(220, 80, 120, 0.15);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align: center;
      transform: translateY(10px);
      opacity: 0;
      animation: cardIn 1.2s ease forwards;
      animation-delay: 2.2s;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .title {
      font-size: 28px;
      margin: 0 0 6px;
      color: #e6004c;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 16px;
      font-size: 14px;
      opacity: 0.85;
      font-weight: 500;
    }

    /* Bouquet burst scene */
    .bouquetScene {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3;
      pointer-events: none;
    }

    .bouquetWrap {
      width: 240px;
      height: 240px;
      position: relative;
      transform: scale(0.25);
      opacity: 0;
      animation: 
        burstIn 0.35s ease forwards,
        stay 0.9s ease forwards 0.35s,
        floatAway 1.1s ease forwards 1.25s;
    }

    @keyframes burstIn {
      from { transform: scale(0.2); opacity: 0; }
      to { transform: scale(1.05); opacity: 1; }
    }

    @keyframes stay {
      from { transform: scale(1.05); }
      to { transform: scale(1); }
    }

    @keyframes floatAway {
      0% { transform: scale(1) translateY(0); opacity: 1; }
      100% { transform: scale(0.85) translateY(-120px); opacity: 0; }
    }

    .flower {
      width: 58px;
      height: 58px;
      position: absolute;
      border-radius: 50%;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.15));
      animation: bloom 0.9s ease forwards;
      opacity: 0;
    }

    @keyframes bloom {
      0% { transform: scale(0) rotate(0deg); opacity: 0; }
      60% { transform: scale(1.25) rotate(140deg); opacity: 1; }
      100% { transform: scale(1) rotate(320deg); opacity: 1; }
    }

    .flower::before, .flower::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      filter: blur(0.5px);
    }

    .centerDot {
      position: absolute;
      width: 16px; 
      height: 16px;
      background: #ffe066;
      border-radius: 50%;
      top: 50%; 
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 6px rgba(255,224,102,0.3);
    }

    .f1 { background: #ff2f6d; top: 38px; left: 88px; animation-delay: 0.05s; }
    .f2 { background: #ff85a1; top: 70px; left: 30px; animation-delay: 0.15s; }
    .f3 { background: #ff85a1; top: 70px; left: 145px; animation-delay: 0.25s; }
    .f4 { background: #ff4d6d; top: 118px; left: 62px; animation-delay: 0.35s; }
    .f5 { background: #ffb3c6; top: 118px; left: 114px; animation-delay: 0.45s; }
    .f6 { background: #ff5c8a; top: 105px; left: 95px; animation-delay: 0.55s; }

    .sparkle {
      position: absolute;
      width: 6px; 
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 18px rgba(255,255,255,0.9);
      animation: sparkle 1.2s ease-in-out infinite;
      opacity: 0.9;
    }

    @keyframes sparkle {
      0%, 100% { transform: scale(0.7); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    /* Letter Container */
    .letter {
      text-align: left;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 20px;
      padding: 20px 18px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.4);
    }

    .type {
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      min-height: 180px;
      color: #4a0e26;
    }

    .signature {
      margin-top: 18px;
      font-family: 'Dancing Script', cursive;
      font-size: 26px;
      color: #e6004c;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      text-align: right;
    }

    .signature.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Floating Hearts */
    .heart {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #ff2f6d;
      transform: rotate(45deg);
      opacity: 0.55;
      animation: float 6s linear infinite;
      z-index: 1;
      pointer-events: none;
    }
    
    .heart::before, .heart::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      background: #ff2f6d;
      border-radius: 50%;
    }
    
    .heart::before { top: -8px; left: 0; }
    .heart::after { left: -8px; top: 0; }

    @keyframes float {
      0% { transform: translateY(20px) rotate(45deg) scale(0.8); opacity: 0; }
      20% { opacity: 0.6; }
      100% { transform: translateY(-110vh) rotate(45deg) scale(1.2); opacity: 0; }
    }

    /* Interactive Buttons */
    .btnRow {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #ff2f6d;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(255, 47, 109, 0.3);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #e6004c;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 47, 109, 0.4);
    }

    .btn:active { transform: scale(0.96); }
  </style>
</head>

<body>
  <div class="glow"></div>

  <div class="bouquetScene">
    <div class="bouquetWrap" id="bouquet">
      <div class="flower f1"><div class="centerDot"></div></div>
      <div class="flower f2"><div class="centerDot"></div></div>
      <div class="flower f3"><div class="centerDot"></div></div>
      <div class="flower f4"><div class="centerDot"></div></div>
      <div class="flower f5"><div class="centerDot"></div></div>
      <div class="flower f6"><div class="centerDot"></div></div>

      <div class="sparkle" style="top:25px; left:40px;"></div>
      <div class="sparkle" style="top:40px; right:35px; animation-delay:0.3s;"></div>
      <div class="sparkle" style="bottom:60px; left:25px; animation-delay:0.6s;"></div>
      <div class="sparkle" style="bottom:45px; right:28px; animation-delay:0.9s;"></div>
    </div>
  </div>

  <div class="stage">
    <div class="card">
      <h1 class="title">💌 For My Namuna</h1>
      <p class="subtitle">A little confession from the bottom of my heart 🥺💗</p>

      <div class="letter">
        <div class="type" id="typeBox"></div>
        <div class="signature" id="sig">Forever Yours,<br>— Sowrup Sharma Paudel 💖</div>
      </div>

      <div class="btnRow">
        <button class="btn" onclick="restart()">Replay 💞</button>
        <button class="btn" onclick="moreHearts()">More Love ✨</button>
      </div>
    </div>
  </div>

  <script>
    const herName = "Namuna";

    const letterText =
`Hey ${herName} 💗

I’ve been thinking about us a lot lately, and I wanted to tell you something special...

To be completely honest, I’ve had the biggest crush on you ever since our school days. Back then, I was never completely sure if you felt the same way. I used to tell myself that maybe I was just being delusional... but deep down, whenever our eyes met, I could swear you were dropping little hints! 😉

Looking back now, it feels surreal. The girl who secretly held my heart in school is officially my girlfriend today. 

Having you in my life makes every single day brighter, warmer, and so much sweeter. Thank you for being you, and for making my dream come true. 💐💞`;

    const typeBox = document.getElementById("typeBox");
    const sig = document.getElementById("sig");
    let i = 0;
    let typingTimer;

    function typeWriter() {
      typeBox.textContent = "";
      sig.classList.remove("show");
      i = 0;
      clearInterval(typingTimer);

      setTimeout(() => {
        typingTimer = setInterval(() => {
          typeBox.textContent += letterText.charAt(i);
          i++;
          if (i >= letterText.length) {
            clearInterval(typingTimer);
            setTimeout(() => {
              sig.classList.add("show");
            }, 300);
          }
        }, 28);
      }, 2500);
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (4 + Math.random() * 3) + "s";
      heart.style.transform = "rotate(45deg) scale(" + (0.6 + Math.random() * 0.8) + ")";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }

    setInterval(createHeart, 450);

    function moreHearts() {
      for (let k = 0; k < 20; k++) {
        setTimeout(createHeart, k * 60);
      }
    }

    function restart() {
      const old = document.getElementById("bouquet");
      const clone = old.cloneNode(true);
      old.parentNode.replaceChild(clone, old);

      typeWriter();
      moreHearts();
    }

    typeWriter();
  </script>
</body>
</html>
